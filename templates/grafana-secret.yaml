{{- if not .Values.grafana.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-grafana-secret
  labels:
    {{- include "texera.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
data:
  {{ .Values.grafana.existingSecretUserKey }}: {{ .Values.grafana.adminUser | b64enc | quote }}
  {{ .Values.grafana.existingSecretPasswordKey }}: {{ .Values.grafana.adminPassword | b64enc | quote }}
{{- end }}
